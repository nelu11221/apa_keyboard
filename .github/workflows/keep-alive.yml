# Ține backend-ul de pe Render treaz: planul gratuit adoarme serviciul după
# 15 minute fără trafic, iar repornirea durează 30–60 s. Un ping la fiecare
# 10 minute evită asta (GitHub poate întârzia rularea cu câteva minute,
# de aceea intervalul e sub 15).
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl -fsS --max-time 90 --retry 3 --retry-delay 10 \
            https://nexa-api-ngva.onrender.com/api/health
